<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="AI 页面净化器 Banner">
  <title>AI 页面净化器</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07091a"/>
      <stop offset="0.5" stop-color="#120e30"/>
      <stop offset="1" stop-color="#1c1146"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.88" cy="0.06" r="0.72">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowI" cx="0.04" cy="0.98" r="0.78">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.62" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="0.45" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="boltGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glowV)"/>
  <rect width="1200" height="320" fill="url(#glowI)"/>
  <rect width="1200" height="320" fill="url(#glowC)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>

  <text x="1172" y="266" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',sans-serif" font-size="240" font-weight="800" letter-spacing="-8" fill="#ffffff" opacity="0.05">AI</text>

  <ellipse cx="162" cy="162" rx="86" ry="70" fill="#7c3aed" opacity="0.5" filter="url(#soft)"/>
  <rect x="96" y="96" width="132" height="132" rx="34" fill="#0a0d24" stroke="url(#frame)" stroke-width="2.5"/>
  <path d="M174 110 L126 172 L154 172 L144 210 L194 148 L164 148 Z" fill="url(#bolt)" filter="url(#boltGlow)"/>

  <path d="M846 70 l3.2 8.8 8.8 3.2 -8.8 3.2 -3.2 8.8 -3.2 -8.8 -8.8 -3.2 8.8 -3.2 Z" fill="#c4b5fd" opacity="0.85"/>
  <path d="M1072 108 l2.4 6.6 6.6 2.4 -6.6 2.4 -2.4 6.6 -2.4 -6.6 -6.6 -2.4 6.6 -2.4 Z" fill="#a5f3fc" opacity="0.8"/>
  <path d="M960 250 l2.8 7.6 7.6 2.8 -7.6 2.8 -2.8 7.6 -2.8 -7.6 -7.6 -2.8 7.6 -2.8 Z" fill="#a78bfa" opacity="0.7"/>

  <rect x="310" y="58" width="212" height="32" rx="16" fill="#0b0d24" stroke="#3b2f63" stroke-width="1.5"/>
  <circle cx="330" cy="74" r="4" fill="#a78bfa"/>
  <text x="344" y="79" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',sans-serif" font-size="12" letter-spacing="0.8" fill="#c4b5fd">CHROME · MV3 · DEEPSEEK</text>

  <text x="308" y="164" font-family="'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="58" font-weight="800" letter-spacing="3" fill="#f8fafc">AI 页面净化器</text>
  <text x="312" y="203" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',sans-serif" font-size="16" letter-spacing="5" fill="#c4b5fd">AI SUMMARY &amp; PAGE CLEANER</text>
  <text x="312" y="245" font-family="'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="16" fill="#94a3b8">一键总结网页正文，顺手清掉弹窗、广告与订阅提示</text>

  <text x="1172" y="58" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',sans-serif" font-size="13" fill="#7a76a8">v1.0.0</text>

  <rect x="0" y="314" width="1200" height="3" fill="url(#rule)"/>
</svg>
