<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #fafafa;
    --text: #1a1a2e;
    --text-secondary: #999;
    --border: #eee;
    --btn-disabled: #ccc;
  }
  :root.dark {
    --bg: #1a1a2e;
    --text: #e0e0e0;
    --text-secondary: #888;
    --border: #2a2a4a;
    --btn-disabled: #444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 240px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
  }
  .container {
    padding: 24px 20px;
    text-align: center;
    position: relative;
  }
  .theme-toggle {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .theme-toggle:hover {
    background: var(--border);
  }
  .logo {
    font-size: 28px;
    margin-bottom: 4px;
  }
  .title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }
  .subtitle {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 20px;
  }
  .btn-summarize {
    width: 100%;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 2px 12px rgba(79,70,229,0.3);
  }
  .btn-summarize:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(79,70,229,0.4);
  }
  .btn-summarize:active {
    transform: scale(0.98);
  }
  .btn-summarize:disabled {
    background: var(--btn-disabled);
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }
  .status {
    margin-top: 14px;
    font-size: 12px;
    color: var(--text-secondary);
    min-height: 18px;
  }
  .status.error { color: #dc2626; }
  .status.success { color: #059669; }
  .links {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .links a {
    font-size: 11px;
    color: var(--text-secondary);
    text-decoration: none;
  }
  .links a:hover { color: #4f46e5; }
</style>
</head>
<body>
<div class="container">
  <button class="theme-toggle" id="themeToggle" title="切换主题">&#9788;</button>
  <div class="logo">&#9889;</div>
  <div class="title">AI 页面净化器</div>
  <div class="subtitle">总结 + 去广告弹窗</div>
  <button class="btn-summarize" id="summarizeBtn">AI 总结</button>
  <div class="status" id="status"></div>
  <div class="links">
    <a href="#" id="optionsLink">设置 API Key</a>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
