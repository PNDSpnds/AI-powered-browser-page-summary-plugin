<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 页面净化器 - 设置</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f8f9fa; color: #1a1a2e; padding: 40px 20px;
  }
  .container { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .subtitle { color: #666; font-size: 14px; margin-bottom: 32px; }
  .card {
    background: white; border-radius: 12px; padding: 28px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04); margin-bottom: 16px;
  }
  .card h2 { font-size: 16px; margin-bottom: 16px; color: #4f46e5; }
  label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; margin-bottom: 16px; transition: border-color 0.15s;
  }
  input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }
  .hint { font-size: 12px; color: #999; margin-top: -8px; margin-bottom: 12px; }
  .btn {
    padding: 10px 24px; border: none; border-radius: 10px;
    font-size: 14px; cursor: pointer; font-weight: 500;
  }
  .btn-primary { background: #4f46e5; color: white; }
  .btn-primary:hover { background: #4338ca; }
  .toast {
    position: fixed; top: 20px; right: 20px;
    background: #059669; color: white; padding: 12px 24px;
    border-radius: 10px; font-size: 14px;
    opacity: 0; transform: translateY(-10px);
    transition: all 0.3s;
    pointer-events: none; z-index: 9999;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: #dc2626; }
  .links { margin-top: 16px; font-size: 13px; }
  .links a { color: #4f46e5; text-decoration: none; }
  .links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <h1>&#9881; AI 页面净化器 设置</h1>
  <p class="subtitle">配置 DeepSeek API 以启用 AI 总结功能</p>

  <div class="card">
    <h2>API 配置</h2>
    <label for="apiKey">DeepSeek API Key</label>
    <input type="password" id="apiKey" placeholder="sk-xxxxxxxxxxxxxxxx">
    <p class="hint">在 <a href="https://platform.deepseek.com/api_keys" target="_blank">platform.deepseek.com</a> 创建 API Key</p>

    <label for="baseUrl">API 地址（可选）</label>
    <input type="text" id="baseUrl" placeholder="https://api.deepseek.com">
    <p class="hint">默认使用 DeepSeek 官方 API，也可填入自定义代理地址</p>

    <button class="btn btn-primary" id="saveBtn">保存设置</button>
  </div>

  <div class="card">
    <h2>使用说明</h2>
    <p style="font-size:13px;color:#666;line-height:1.8;">
      1. 填入 DeepSeek API Key 并保存<br>
      2. 浏览任意网页<br>
      3. 点击浏览器工具栏的扩展图标<br>
      4. 等待 AI 生成总结，页面将被替换为干净的总结视图<br>
      5. 点击「返回原页面」回到原始网页<br>
      <br>
      扩展会自动清除网页上的登录弹窗、Cookie 横幅、订阅提示和广告。
    </p>
  </div>

  <div class="links">
    <a href="https://platform.deepseek.com/api_keys" target="_blank">获取 API Key</a>
    &middot;
    <a href="https://api-docs.deepseek.com/" target="_blank">DeepSeek API 文档</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="options.js"></script>
</body>
</html>
